# IgH EtherCAT Master — default configuration for RK3588 CNC.
# RK3588 Ethernet uses stmmac/dwmac-rk; no IgH native driver exists for it,
# so we use the generic driver which hooks into the Linux network stack.
DEVICE_MODULES="generic"

# Network interface used by the generic driver.
# Board has end0 (eth0) as the primary NIC.
MASTER0_DEVICE="end0"

# Debug level: 0=none, 1=few, 2=more
MASTER0_DEBUG_LEVEL="0"
