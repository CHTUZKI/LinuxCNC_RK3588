# No Mali userspace DRI yet — avoid glamor (needs GL); use plain modesetting.
# ShadowFB：在系统内存维护一份 framebuffer 副本，所有绘制先到 shadow 再
# 一次性 blit 到屏幕。纯 CPU 但比 AccelMethod=none 快得多，且能消除拖窗残影
# （被遮挡窗口 Expose 重绘慢时，shadow 副本仍能立即整块刷新）。
Section "Device"
	Identifier "RockchipModesetting"
	Driver "modesetting"
	Option "AccelMethod" "none"
	Option "ShadowFB" "true"
	Option "SWCursor" "true"
EndSection
