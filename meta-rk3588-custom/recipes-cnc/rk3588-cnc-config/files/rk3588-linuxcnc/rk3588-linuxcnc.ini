# RK3588 LinuxCNC — EtherCAT milling machine with SSDC06-ECX-H
#
# Motor: AM23RS3DMA (4096 counts/rev encoder)
# Screw: lead 10 mm/rev (measured; thread pitch may still read ~5 mm)
# INPUT_SCALE = 4096 / 10 = 409.6 counts/mm
#
# TODO (adjust to your machine):
#   - Encoder resolution / leadscrew pitch  -> INPUT_SCALE
#   - Travel limits                          -> [AXIS_*]/[JOINT_*] MIN/MAX_LIMIT
#   - Max velocity / acceleration            -> MAX_VELOCITY, MAX_ACCELERATION
#   - Spindle                                -> currently simulated; replace with real VFD later
#   - Home method / velocities               -> configure in drive via Stepper Suite

[EMC]
VERSION = 1.1
MACHINE = RK3588-LinuxCNC
DEBUG = 0

[DISPLAY]
DISPLAY = gmoccapy
CYCLE_TIME = 100

MAX_FEED_OVERRIDE    = 1.5
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5

DEFAULT_SPINDLE_SPEED = 6000
DEFAULT_LINEAR_VELOCITY = 50
MIN_LINEAR_VELOCITY     = 0
MAX_LINEAR_VELOCITY     = 200
DEFAULT_SPINDLE_0_SPEED = 6000
MIN_SPINDLE_0_SPEED     = 0
MAX_SPINDLE_0_SPEED     = 24000
MAX_SPINDLE_0_OVERRIDE  = 1.2
MIN_SPINDLE_0_OVERRIDE  = 0.5

PROGRAM_PREFIX = /home/root/linuxcnc/nc_files
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5

GCODE_VIEW_TOOL_MIN_DIA = 2.0

INCREMENTS = 5.000 mm, 1.000 mm, 0.100 mm, 0.010 mm, 0.001 mm

# User-created messages (wired via EK1814 digital inputs in io.hal)
MESSAGE_TEXT = SAFETY DOOR OPEN
MESSAGE_TYPE = okdialog
MESSAGE_PINNAME = door-open

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Grayscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python3

[RS274NGC]
RS274NGC_STARTUP_CODE = G17 G21 G40 G43H0 G54 G64P0.005 G80 G90 G94 G97 M5 M9
PARAMETER_FILE = rk3588.var
SUBROUTINE_PATH = ./macros

[PYTHON]
PATH_PREPEND = ./python
TOPLEVEL = ./python/toplevel.py
LOG_LEVEL = 0

[EMCMOT]
EMCMOT =              motmod
HOMEMOD =             ssdc_homecomp
COMM_TIMEOUT =          1.0
BASE_PERIOD  =          100000
SERVO_PERIOD =          1000000

[TASK]
TASK =                  milltask
CYCLE_TIME =            0.001

[HAL]
HALFILE = core_lcec.hal
HALFILE = spindle_sim.hal
HALFILE = home.hal
HALFILE = io.hal
HALFILE = estop.hal

POSTGUI_HALFILE = postgui.hal

HALUI = halui

[HALUI]
#No Content

[TRAJ]
COORDINATES =      X
LINEAR_UNITS =     mm
ANGULAR_UNITS =    degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 200
# Do not restore last DRO — incremental EtherCAT fb won't match after reboot
# and trips FERROR before the first home. Home each session instead.
#POSITION_FILE =    position.txt
#NO_FORCE_HOMING = 1

[EMCIO]
TOOL_TABLE = tool.tbl
TOOL_CHANGE_POSITION = 100 0 0
TOOL_CHANGE_QUILL_UP = 1

[KINS]
KINEMATICS = trivkins coordinates=x
JOINTS = 1

# ==================== X AXIS ====================
[AXIS_X]
MIN_LIMIT = -400.0
MAX_LIMIT = 400.0
MAX_VELOCITY = 100
MAX_ACCELERATION = 800.0

[JOINT_0]
TYPE =                          LINEAR
MAX_VELOCITY =                  100
MAX_ACCELERATION =              800.0
BACKLASH = 0.000
# INPUT_SCALE = encoder counts per mm = 4096 counts/rev ÷ 10 mm/rev = 409.6
INPUT_SCALE =                   409.6
OUTPUT_SCALE = 1.000
MIN_LIMIT =                     -400.0
MAX_LIMIT =                     400.0
FERROR = 5.0
MIN_FERROR = 0.5
# Drive-side hard-stop home via HOMEMOD=ssdc_homecomp + cia402_home.py.
# SEARCH/LATCH unused (custom homemod); keep zero to pass config checks.
HOME_OFFSET =                    0.0
HOME =                           0.0
HOME_SEARCH_VEL =                0.0
HOME_LATCH_VEL =                 0.0
HOME_FINAL_VEL =                 0.0
HOME_USE_INDEX =                 NO
HOME_IGNORE_LIMITS =             YES
HOME_SEQUENCE = 0
HOME_IS_SHARED =                 NO

