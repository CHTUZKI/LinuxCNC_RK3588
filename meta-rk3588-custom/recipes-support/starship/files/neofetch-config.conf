# Neofetch config for rk3588-image-cnc
# Customized to show PREEMPT_RT kernel, EtherCAT, LinuxCNC info

# Custom info functions for CNC-specific data
# Must be defined before print_info

# Show PREEMPT_RT status
kernel_rt() {
    if uname -v 2>/dev/null | grep -q "PREEMPT_RT"; then
        prin "Kernel RT" "PREEMPT_RT (Real-Time)"
    elif zcat /proc/config.gz 2>/dev/null | grep -q "CONFIG_PREEMPT_RT=y"; then
        prin "Kernel RT" "PREEMPT_RT (Real-Time)"
    else
        prin "Kernel RT" "Standard (Non-RT)"
    fi
}

# Show CPU temperature
cpu_temp_info() {
    local temp=""
    for zone in /sys/class/thermal/thermal_zone*/temp; do
        if [ -r "$zone" ]; then
            local t=$(cat "$zone" 2>/dev/null)
            if [ -n "$t" ] && [ "$t" -gt 0 ] 2>/dev/null; then
                local celsius=$((t / 1000))
                temp="${celsius}C"
                break
            fi
        fi
    done
    [ -n "$temp" ] && prin "CPU Temp" "$temp" || prin "CPU Temp" "N/A"
}

# Show GPU frequency
gpu_freq() {
    local freq=""
    for f in /sys/class/devfreq/*/cur_freq; do
        if [ -r "$f" ]; then
            local hz=$(cat "$f" 2>/dev/null)
            if [ -n "$hz" ] && [ "$hz" -gt 0 ] 2>/dev/null; then
                local mhz=$((hz / 1000000))
                freq="${mhz}MHz"
                break
            fi
        fi
    done
    [ -n "$freq" ] && prin "GPU Freq" "$freq" || prin "GPU Freq" "N/A"
}

# Show EtherCAT master status
ethercat_info() {
    if [ -d /sys/module/ec_master ]; then
        local ver=$(cat /sys/module/ec_master/version 2>/dev/null | head -1 || echo "")
        if [ -x /usr/bin/ethercat ]; then
            local state=$(/usr/bin/ethercat master 2>/dev/null | grep "Master states" | sed 's/.*: //' | head -1 || echo "")
            if [ -n "$state" ]; then
                prin "EtherCAT" "IgH Master ($state)"
            else
                prin "EtherCAT" "IgH Master (loaded)"
            fi
        else
            prin "EtherCAT" "IgH Master (loaded)"
        fi
    elif [ -x /usr/bin/ethercat ]; then
        prin "EtherCAT" "IgH Master (not running)"
    else
        prin "EtherCAT" "Not installed"
    fi
}

# Show LinuxCNC version
linuxcnc_info() {
    if [ -x /usr/bin/linuxcnc ]; then
        local ver=$(/usr/bin/linuxcnc --version 2>/dev/null | head -1 || echo "installed")
        prin "LinuxCNC" "$ver"
    else
        prin "LinuxCNC" "Not installed"
    fi
}

# Show Starship version
starship_info() {
    if [ -x /usr/bin/starship ]; then
        local ver=$(/usr/bin/starship --version 2>/dev/null | head -1 || echo "installed")
        prin "Starship" "$ver"
    else
        prin "Starship" "Not installed"
    fi
}

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    kernel_rt
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "WM Theme" wm_theme
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "Terminal Font" term_font
    info "CPU" cpu
    cpu_temp_info
    info "GPU" gpu
    gpu_freq
    info "Memory" memory
    info "Disk" disk

    ethercat_info
    linuxcnc_info
    starship_info

    info cols
}


# Title
title_fqdn="off"

# Kernel
kernel_shorthand="off"

# Distro
distro_shorthand="off"
os_arch="on"

# Uptime
uptime_shorthand="on"

# Memory
memory_percent="on"
memory_unit="mib"

# Packages
package_managers="on"

# Shell
shell_path="off"
shell_version="on"

# CPU
speed_type="scaling_cur_freq"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="C"

# GPU
gpu_brand="on"
gpu_type="all"

# Resolution
refresh_rate="on"

# GTK
gtk_shorthand="off"
gtk2="on"
gtk3="on"

# IP
public_ip_host="http://ident.me"
public_ip_timeout=2

# Desktop Environment
de_version="on"

# Disk
disk_show=('/')
disk_subtitle="mount"
disk_percent="on"

# Text Colors
colors=(distro)

# Text Options
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"

# Color Blocks
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1
col_offset="auto"

# Progress Bars
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed=2
bar_color_total=8

# Info display
cpu_display="off"
memory_display="off"
battery_display="off"
disk_display="off"

# Backend
image_backend="ascii"
image_source="auto"

# Ascii
ascii_distro="auto"
ascii_colors=(distro)
ascii_bold="on"

# Misc
stdout="off"
