# Boot fitImage from eMMC GPT rootfs (update.img: uboot/misc/rootfsA).
# Vendor Rockchip kernel console is ttyFIQ0 @ 115200.
CONFIG_BOOTSTD_FULL=y
CONFIG_CMD_SYSBOOT=y
CONFIG_BOOTCOMMAND="part list mmc 0; setenv bootargs root=PARTLABEL=rootfsA rootwait rw rootfstype=ext4 earlycon console=tty1 console=ttyFIQ0,115200n8; for p in 3 1 2 4 5 6 7; do echo Trying mmc 0:${p}; if load mmc 0:${p} ${kernel_addr_r} /boot/fitImage; then bootm ${kernel_addr_r}; fi; done; bootflow scan -l; bootflow scan -b"
