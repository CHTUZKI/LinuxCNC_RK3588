#@TYPE: Machine
#@NAME: HD-RK3588-CORE
#@DESCRIPTION: Vanxak HD-RK3588-CORE module (RK3588J, 8GB LPDDR4x + eMMC)

require conf/machine/include/rk3588.inc

# Rockchip official vendor kernel (rknpu / HDMI / USB3). meta-rockchip still
# supplies U-Boot, rkbin, and machine glue — only the kernel provider changes.
PREFERRED_PROVIDER_virtual/kernel = "linux-rockchip"
PREFERRED_VERSION_linux-rockchip = "6.1%"
KBUILD_DEFCONFIG = "rockchip_linux_defconfig"
# rk3588s.inc appends linux-yocto .scc fragments; force clear for vendor kernel.
KERNEL_FEATURES:forcevariable = ""

KERNEL_DEVICETREE = "rockchip/hd-rk3588-core.dtb"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

UBOOT_MACHINE = "evb-rk3588_defconfig"

# Vendor kernel uses fiq-debugger as ttyFIQ0 @ 115200 (not mainline ttyS2).
SERIAL_CONSOLES = "115200;ttyFIQ0"
