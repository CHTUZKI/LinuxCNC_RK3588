#@TYPE: Machine
#@NAME: HD-RK3588-CORE (LinuxCNC + IgH EtherCAT)
#@DESCRIPTION: PREEMPT_RT + X11 GUI (Mali) + IgH EtherCAT for LinuxCNC
#
# LinuxCNC 分支唯一 MACHINE。PREEMPT_RT 内核配置内嵌于此（不再依赖 hd-rk3588-core-rt）。
# 通用 RT 镜像在 preempt-rt 分支（rk3588-image-rt）。

require conf/machine/hd-rk3588-core.conf

MACHINEOVERRIDES .= ":cnc"
RK3588_KERNEL_RT = "1"

# deploy 默认 ${TMPDIR}/deploy/images/${MACHINE} → hd-rk3588-core-cnc

LINUX_VERSION_EXTENSION = "-rockchip-cnc"

# X11 desktop + Axis/QtVCP（Axis 预览需要 GObject introspection typelibs）
DISTRO_FEATURES:append = " x11 opengl gobject-introspection-data"

# meta-rockchip 默认 XSERVER 含 xserver-xorg-xvfb，但 scarthgap 的 xserver-xorg
# 需 PACKAGECONFIG[xvfb] 才会产出该分包；CNC 有实体 GPU 显示，不需要 Xvfb。
XSERVER = " \
	xserver-xorg \
	xserver-xorg-utils \
	xserver-xorg-extension-glx \
	xserver-xorg-module-libwfb \
	xserver-xorg-module-exa \
	xf86-video-modesetting \
	xf86-input-evdev \
	xf86-input-mouse \
	"

# Software GL fallback until Mali userspace is wired into meta-rockchip.
MACHINE_EXTRA_RRECOMMENDS:append = " mesa-megadriver"

PREFERRED_VERSION_tk = "8.6.13"
PREFERRED_VERSION_tcl = "8.6.13"
